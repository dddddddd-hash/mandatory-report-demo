<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 强制报告智能体</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/login.css"></head>
<body class="login-page">
  <header class="login-header"><a class="brand" href="/login"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 4 6v6c0 4 4 7 8 9 4-2 8-5 8-9V6l-8-3Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></span><span>强制报告智能体<span class="brand-caption">保护，从看见开始</span></span></a><a class="login-guest" href="/ask">先以访客使用 <span aria-hidden="true">↗</span></a></header>
  <main class="login-layout">
    <section class="login-story"><p class="eyebrow">让每一条线索被看见</p><h1>看见，是保护<br>的第一步。</h1><p class="login-story-copy">从疑问到行动，让报告更清晰，让保护更及时。</p><div class="login-orbit" aria-hidden="true"><div class="orbit-ring"></div><div class="orbit-shield"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 3 4 6v6c0 4 4 7 8 9 4-2 8-5 8-9V6l-8-3Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></div><span class="orbit-note note-one">了解报告制度</span><span class="orbit-note note-two">记录与保护</span><span class="orbit-dot"></span></div><p class="login-story-foot">智能问答 · 线索报告 · 情景实训</p></section>
    <section class="login-card" aria-labelledby="auth-title"><div class="login-tabs" role="tablist" aria-label="账号入口"><button id="login-tab" type="button" role="tab" aria-selected="true" aria-controls="login-form">登录</button><button id="register-tab" type="button" role="tab" aria-selected="false" aria-controls="register-form">注册</button></div><h2 id="auth-title">欢迎回来</h2><p id="auth-description" class="muted">登录后，继续您的对话与报告记录。</p>
      <form id="login-form"><label class="field"><span>邮箱</span><input name="email" type="email" required maxlength="254" autocomplete="username" placeholder="请输入注册邮箱"></label><label class="field"><span>密码</span><div class="password-field"><input id="login-password" name="password" type="password" required maxlength="100" autocomplete="current-password" placeholder="请输入密码"><button id="toggle-password" type="button" aria-label="显示密码">显示</button></div></label><button class="primary auth-submit" type="submit">登录并继续 <span aria-hidden="true">→</span></button></form>
      <form id="register-form" hidden><label class="field"><span>邮箱</span><input name="email" type="email" required maxlength="254" autocomplete="email" placeholder="请输入邮箱"></label><label class="field"><span>如何称呼您 <small>选填</small></span><input name="name" maxlength="60" autocomplete="nickname" placeholder="例如：林老师"></label><label class="field"><span>您的报告身份</span><select id="register-identity" name="identity" required><option value="">请选择身份</option><option>未成年本人</option><option>家长/监护人</option><option>教师/教育工作者</option><option>医护人员</option><option>社区工作人员</option><option>其他</option></select></label><label id="register-other-field" class="field" hidden><span>其他身份说明</span><input id="register-other" name="identityOther" maxlength="100" placeholder="请说明您的身份"></label><p class="login-password-note">注册仅检查邮箱格式，无需验证码。密码统一为 123456。所选身份会自动用于报告表单，注册后不可修改。</p><button class="primary auth-submit" type="submit">注册并进入 <span aria-hidden="true">→</span></button></form>
      <p id="auth-error" class="auth-error" role="alert" hidden></p><div class="login-card-bottom"><span>公安及协同部门</span><a id="receiver-login-entry" href="/receiver">进入接收工作台 ↗</a></div>
    </section>
  </main><footer class="login-footer"><span>强制报告智能体 · 让保护及时发生</span><span>遇紧急危险，请直接拨打 110</span></footer>
  <script type="module" src="/login.js"></script>
</body></html>
