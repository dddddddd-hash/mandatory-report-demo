<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9fe870"><title>公众服务 · 强制报告智能体</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/portal.css"></head>
<body class="public-page">
  <a class="skip-link" href="#portal-main">跳到页面内容</a>
  <div class="public-shell"><aside id="public-sidebar" class="public-sidebar"></aside><div class="public-workspace"><header id="public-topbar" class="public-topbar"></header><main id="portal-main" class="portal-main"><p class="muted">正在载入公众服务…</p></main></div></div>
  <dialog id="record-detail" class="record-dialog" aria-labelledby="record-detail-title"><div class="panel-heading"><h2 id="record-detail-title">记录详情</h2><button type="button" id="close-record" class="icon-button" aria-label="关闭记录详情">×</button></div><div id="record-detail-body"></div></dialog>
  <dialog id="delete-dialog" class="confirm-dialog" aria-labelledby="delete-title"><h2 id="delete-title">删除这条记录？</h2><p>删除后无法恢复，个人记录与单位台账会同步更新。</p><div class="actions"><button type="button" id="delete-cancel">取消</button><button type="button" id="delete-confirm" class="danger">删除记录</button></div></dialog>
  <dialog id="memory-dialog" class="memory-dialog" aria-labelledby="memory-title"><div class="panel-heading"><div><h2 id="memory-title">我的记忆</h2><p id="memory-owner" class="muted"></p></div><button type="button" id="memory-close" class="icon-button" aria-label="关闭记忆">×</button></div><p class="memory-note">登录后的记忆绑定您的账号，换模型或新建对话仍可使用。访客记忆与账号记忆分开；请勿保存当事人的身份信息或秘密。</p><label class="field"><span>长期记忆</span><textarea id="memory-long-term" maxlength="2000" placeholder="例如：我是教师，希望先给可执行的步骤，再解释制度。"></textarea></label><p class="muted">也可以在对话中明确说“请记住我的回答偏好”；请勿保存密钥或当事人的身份信息。</p><details class="memory-recent"><summary>短期记忆 · 近期对话摘录</summary><div id="memory-short-term"></div></details><div class="actions dialog-actions"><button type="button" id="memory-clear" class="text-button">清空全部记忆</button><button type="button" id="memory-save" class="primary">保存长期记忆</button></div></dialog>
  <div id="toast" hidden role="status"></div><script type="module" src="/portal.js"></script>
</body></html>
